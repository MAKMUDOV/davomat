<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Davomat daftari · Asia Academy</title>
<meta name="description" content="O'quvchilar davomati, vazifa va dars faolligi — o'qituvchi va ota-ona uchun.">
<meta name="theme-color" content="#b23749">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Asia Academy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Lato:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f7f4f5; --sheet:#ffffff; --ink:#24181b; --muted:#6e5f63; --rule:#ece3e5; --rule-strong:#d6c8cb;
  --accent:#b23749; --accent-ink:#8f2638; --accent-soft:#f9e8eb; --bubble:#f2eced; --brand:#b23749;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --late:#b86e00; --late-bg:#fdf0d9; --exc:#2c6fb3; --exc-bg:#e2eefa; --abs:#c0312b; --abs-bg:#fbe5e3;
  --f-display:"Kanit",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Lato",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#151012; --sheet:#1e171a; --ink:#f1e9eb; --muted:#ab9a9f; --rule:#33272b; --rule-strong:#4a3a3f;
  --accent:#f07f91; --accent-ink:#f5a3b0; --accent-soft:#3c1d24; --bubble:#2a2024; --brand:#b23749;
  --ok:#5fcf8d; --ok-bg:#163223; --late:#f0b04f; --late-bg:#3a2a10; --exc:#7fb6ee; --exc-bg:#15293f; --abs:#ff7d74; --abs-bg:#3d1916; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font:600 clamp(25px,5vw,32px)/1.1 var(--f-display);letter-spacing:0;margin:0;text-wrap:balance}
h1 small{display:block;font:500 12px/1.4 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h2{font:500 19px/1.25 var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:4px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:500 14px var(--f-body);padding:8px 12px;border-radius:7px;cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--abs);color:#fff;font:600 11px var(--f-mono);margin-left:4px;vertical-align:1px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{border:1px solid var(--rule-strong);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.danger{color:var(--abs);border-color:var(--abs)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=date],input[type=text],input[type=password],input[type=email],input[type=number],input[type=month],input[type=tel],textarea,select{background:var(--paper);border:1px solid var(--rule-strong);border-radius:8px;padding:9px 11px;min-width:0;font-size:16px}
textarea{width:100%;min-height:90px;resize:vertical}
.date{display:flex;gap:4px;align-items:center}
.date .btn{padding:8px 11px}
.xl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:start}
.stat{border-radius:9px;padding:9px 11px;display:grid;gap:2px}
.stat b{font:600 22px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat>span{font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.s-k{background:var(--ok-bg);color:var(--ok)} .s-x{background:var(--late-bg);color:var(--late)}
.s-s{background:var(--exc-bg);color:var(--exc)} .s-y{background:var(--abs-bg);color:var(--abs)}
.c-t{color:var(--ok)} .c-q{color:var(--late)} .c-n{color:var(--abs)}
ol.roll{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.roll li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.num{font:500 13px var(--f-mono);color:var(--muted);text-align:right}
.who{min-width:0;display:grid;gap:3px;justify-items:start}
.lvl{justify-self:start;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.lv0{background:var(--ok-bg);color:var(--ok)} .lv1{background:var(--late-bg);color:var(--late)}
.lv2{background:var(--abs-bg);color:var(--abs)} .lv3{background:var(--abs);color:var(--sheet)}
.seg{display:flex;border:1px solid var(--rule-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--rule);background:transparent;min-width:44px;height:40px;cursor:pointer;font:600 15px var(--f-mono);color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button:disabled{cursor:not-allowed;opacity:.45}
.seg button[aria-pressed="true"].k,.seg button[aria-pressed="true"].ht{background:var(--ok);color:var(--sheet)}
.seg button[aria-pressed="true"].x,.seg button[aria-pressed="true"].hq{background:var(--late);color:var(--sheet)}
.seg button[aria-pressed="true"].s{background:var(--exc);color:var(--sheet)}
.seg button[aria-pressed="true"].y,.seg button[aria-pressed="true"].hn{background:var(--abs);color:var(--sheet)}
.seg button[aria-pressed="true"].p1{background:var(--muted);color:var(--sheet)}
.seg button[aria-pressed="true"].p2{background:var(--exc);color:var(--sheet)}
.seg button[aria-pressed="true"].p3{background:var(--ok);color:var(--sheet)}
.login .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg.sm button{height:32px;min-width:38px;font-size:14px}
.seg.txt button{font:500 13px var(--f-body);padding:0 10px}
.extra{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend code{font:600 13px var(--f-mono);padding:0 6px;border-radius:5px}
.task{display:grid;gap:5px}
.task input{width:100%}
.nms{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.nm{display:inline-block;background:var(--sheet);color:var(--ink);border:1px solid var(--rule-strong);border-radius:6px;padding:1px 8px;font-size:13px;line-height:1.5;cursor:pointer;overflow-wrap:anywhere}
.nm:hover,.nmb:hover{border-color:var(--accent);color:var(--accent)}
.nmb{all:unset;cursor:pointer;font-weight:600;overflow-wrap:anywhere;border-bottom:1px dashed var(--rule-strong)}
.nmb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
dl.hwl{margin:0;display:grid;gap:6px;border:1px solid var(--rule);border-radius:9px;padding:10px 12px}
dl.hwl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
dl.hwl dt{font-weight:600;font-size:13px;white-space:nowrap;padding-top:5px}
dl.hwl dd{margin:0}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:6px 7px;text-align:center;white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--paper)}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--sheet);z-index:1;max-width:190px;overflow:hidden;text-overflow:ellipsis}
th.name{background:var(--paper);z-index:2}
td.name .nmb{font-weight:500;white-space:nowrap}
td.m{font:600 13px var(--f-mono)}
td.m.k{color:var(--ok)} td.m.x{color:var(--late);background:var(--late-bg)} td.m.s{color:var(--exc);background:var(--exc-bg)} td.m.y{color:var(--abs);background:var(--abs-bg)}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.step{border-radius:10px;padding:12px;display:grid;gap:4px}
.step b{font:600 13px var(--f-mono)}
.step strong{font:600 16px/1.25 var(--f-display)}
.step p{margin:0;font-size:13px}
.rules{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.rules li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.rules .sym{font:600 16px var(--f-mono);text-align:center;border-radius:7px;padding:3px 0}
.pts{font:600 14px var(--f-mono);white-space:nowrap}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cfg label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
ol.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.tasks li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
ol.tasks .d{font:500 13px var(--f-mono);color:var(--muted)}
ol.tasks .t{overflow-wrap:anywhere}
ol.tasks .r{font:500 13px var(--f-mono);white-space:nowrap}
.empty{text-align:center;padding:26px 12px;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.glist{display:grid;gap:12px}
.group{border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.srow .code{font:500 13px var(--f-mono);color:var(--muted)}
.cred{grid-column:1/-1;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:9px;padding:10px 12px;display:grid;gap:6px}
.cred pre{margin:0;white-space:pre-wrap;font:500 14px/1.5 var(--f-mono);user-select:all}
/* Kirish */
.login{max-width:420px;margin:6vh auto 0;width:100%}
.login form{display:grid;gap:12px}
.login label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.login input{width:100%}
.err{color:var(--abs);font-size:14px;min-height:20px;margin:0}
/* Kartochka / dialog */
.dlg{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#0b1220 50%,transparent);display:flex;justify-content:center;align-items:flex-end;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.panel{background:var(--sheet);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.panel.chatp{height:90%;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
@media (min-width:700px){.dlg{align-items:center}.panel{border-radius:16px;max-height:86%}.panel.chatp{height:80%}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph h2{font-size:22px;overflow-wrap:anywhere}
.btn.x{font-size:20px;line-height:1;padding:6px 12px}
.mname{min-width:130px;text-align:center}
.dsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dsum>div{border:1px solid var(--rule);border-radius:10px;padding:10px;display:grid;gap:3px;align-content:start;background:var(--sheet)}
.dsum b{font:600 20px/1.1 var(--f-mono)}
ol.hist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
ol.hist li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.hd{display:grid;justify-items:center;align-content:start}
.hd b{font:600 20px/1 var(--f-mono)}
.hd span{font-size:12px;color:var(--muted)}
.hb{display:grid;gap:4px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:13px;font-weight:500;padding:2px 9px;border-radius:6px;background:var(--paper);color:var(--muted)}
.tag.s-k{background:var(--ok-bg);color:var(--ok)} .tag.s-x{background:var(--late-bg);color:var(--late)}
.tag.s-s{background:var(--exc-bg);color:var(--exc)} .tag.s-y{background:var(--abs-bg);color:var(--abs)}
.pp1{border:1px solid var(--rule-strong)} .pp2{background:var(--exc-bg)!important;color:var(--exc)!important} .pp3{background:var(--ok-bg)!important;color:var(--ok)!important}
/* Xabarlar */
.chat{display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px 2px;min-height:0}
.chat.page{max-height:min(60vh,560px);min-height:200px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--bubble);align-self:flex-start;display:grid;gap:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--sheet)}
.msg time{font-size:11px;opacity:.7;justify-self:end}
.compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.compose textarea{min-height:46px;max-height:160px}
.tlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.tlist li{border-bottom:1px solid var(--rule)}
.tlist button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 4px;cursor:pointer}
.tlist button:focus-visible{outline:2px solid var(--accent)}
.tlist .nmline{font-weight:600}
.tlist .last{grid-column:1/-1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .when{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--abs);margin-left:6px;vertical-align:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
.spin{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.setup code{font:500 13px var(--f-mono);background:var(--paper);padding:1px 5px;border-radius:4px}
@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .dsum{grid-template-columns:repeat(2,1fr)}
  ol.roll li{grid-template-columns:22px minmax(0,1fr)}
  ol.roll li>.seg{grid-column:1/-1}
  .extra{grid-column:1/-1;display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px}
  .seg button{flex:1}
  dl.hwl div{grid-template-columns:1fr;gap:2px}
  .msg{max-width:90%}
}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty"><div class="spin" aria-label="Yuklanmoqda"></div></div></div>
<div id="dlg" class="dlg" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Sayt ishlashi uchun brauzerda JavaScript yoqilgan bo'lishi kerak.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
